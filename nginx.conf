server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    # Docker (127.0.0.11) + k3s (10.43.0.10). Variável no proxy_pass evita
    # o nginx falhar na subida quando o hostname não existe (ex.: K8s).
    resolver 127.0.0.11 10.43.0.10 valid=10s ipv6=off;

    location = /connections-health/front {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location = /connections-health/bff-auth {
        set $upstream_bff_auth bff-auth:8381;
        proxy_pass http://$upstream_bff_auth/health;
    }

    location = /connections-health/bff-core {
        set $upstream_bff_core bff-core:8382;
        proxy_pass http://$upstream_bff_core/health;
    }

    location = /connections-health/ms-auth {
        set $upstream_ms_auth ms-auth:8081;
        proxy_pass http://$upstream_ms_auth/actuator/health/liveness;
    }

    location = /connections-health/ms-communication {
        set $upstream_ms_communication ms-communication:8082;
        proxy_pass http://$upstream_ms_communication/actuator/health/liveness;
    }

    location = /connections-health/ms-company {
        set $upstream_ms_company ms-company:8083;
        proxy_pass http://$upstream_ms_company/actuator/health/liveness;
    }

    location = /connections-health/ms-user {
        set $upstream_ms_user ms-user:8085;
        proxy_pass http://$upstream_ms_user/actuator/health/liveness;
    }

    location = /connections-health/ms-user-consents {
        set $upstream_ms_user_consents ms-user-consents:8086;
        proxy_pass http://$upstream_ms_user_consents/actuator/health/liveness;
    }

    location = /connections-health/srv-email-sender {
        set $upstream_srv_email_sender srv-email-sender:8601;
        proxy_pass http://$upstream_srv_email_sender/health;
    }

    location = /connections-health/srv-token-manager {
        set $upstream_srv_token_manager srv-token-manager:8700;
        proxy_pass http://$upstream_srv_token_manager/health/;
    }

    location = /connections-health/srv-sms-sender {
        set $upstream_srv_sms_sender srv-sms-sender:8610;
        proxy_pass http://$upstream_srv_sms_sender/health;
    }

    location = /connections-health/mock-sms-gateway {
        set $upstream_mock_sms_gateway mock-sms-gateway:8089;
        proxy_pass http://$upstream_mock_sms_gateway/health;
    }

    location = /connections-health/minio {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio/minio/health/live;
    }

    location = /connections-health/rabbitmq {
        set $upstream_rabbitmq rabbitmq:15672;
        proxy_pass http://$upstream_rabbitmq/api/health/checks/alarms;
        proxy_hide_header WWW-Authenticate;
        proxy_intercept_errors off;
    }

    location = /connections-health/prometheus {
        set $upstream_prometheus prometheus:9090;
        proxy_pass http://$upstream_prometheus/-/healthy;
        proxy_hide_header WWW-Authenticate;
    }

    location = /connections-health/grafana {
        set $upstream_grafana grafana:3000;
        proxy_pass http://$upstream_grafana/api/health;
        proxy_hide_header WWW-Authenticate;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
