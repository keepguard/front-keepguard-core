server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    location = /connections-health/front {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location = /connections-health/bff-auth {
        proxy_pass http://bff-auth:8381/health;
    }

    location = /connections-health/bff-core {
        proxy_pass http://bff-core:8382/health;
    }

    location = /connections-health/ms-auth {
        proxy_pass http://ms-auth:8081/actuator/health;
    }

    location = /connections-health/ms-communication {
        proxy_pass http://ms-communication:8082/actuator/health;
    }

    location = /connections-health/ms-company {
        proxy_pass http://ms-company:8083/actuator/health;
    }

    location = /connections-health/ms-user {
        proxy_pass http://ms-user:8085/actuator/health;
    }

    location = /connections-health/ms-user-consents {
        proxy_pass http://ms-user-consents:8086/actuator/health;
    }

    location = /connections-health/srv-email-sender {
        proxy_pass http://srv-email-sender:8601/health;
    }

    location = /connections-health/srv-token-manager {
        proxy_pass http://srv-token-manager:8700/health;
    }

    location = /connections-health/srv-sms-sender {
        proxy_pass http://srv-sms-sender:8610/health;
    }

    location = /connections-health/mock-sms-gateway {
        proxy_pass http://mock-sms-gateway:8089/health;
    }

    location = /connections-health/minio {
        proxy_pass http://minio:9000/minio/health/live;
    }

    location = /connections-health/rabbitmq {
        proxy_pass http://rabbitmq:15672/api/health/checks/alarms;
        proxy_hide_header WWW-Authenticate;
        proxy_intercept_errors off;
    }

    location = /connections-health/prometheus {
        proxy_pass http://prometheus:9090/-/healthy;
        proxy_hide_header WWW-Authenticate;
    }

    location = /connections-health/grafana {
        proxy_pass http://grafana:3000/api/health;
        proxy_hide_header WWW-Authenticate;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
