apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-keepguard-core
  namespace: keepguard
  labels:
    app: front-keepguard-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-keepguard-core
  template:
    metadata:
      labels:
        app: front-keepguard-core
    spec:
      containers:
      - name: front-keepguard-core
        image: ghcr.io/keepguard/front-keepguard-core:1.0.0
        imagePullPolicy: Always
        env:
        - name: DEFAULT_TENANT_ID
          value: {{ .Values.tenantId | default "f7fc7350-b9fc-4e54-9c58-ac9385b23ae3" | quote }}
        - name: FRONT_TENANT_ID_IN_BUNDLE
          value: "f7fc7350-b9fc-4e54-9c58-ac9385b23ae3"
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: tenant-rewrite
          mountPath: /docker-entrypoint.d/45-tenant-id.sh
          subPath: 45-tenant-id.sh
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
      volumes:
      - name: tenant-rewrite
        configMap:
          name: front-tenant-rewrite
          defaultMode: 0755
